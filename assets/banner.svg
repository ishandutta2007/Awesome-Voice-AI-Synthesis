<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080C17"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="highlight-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
    </filter>

    <filter id="subtle-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
    </filter>

    <style>
      .sound-bar {
        transform-origin: bottom;
        animation: pulseBar 1.8s ease-in-out infinite alternate;
      }
      .sound-bar:nth-child(2n) { animation-duration: 1.4s; animation-delay: 0.2s; }
      .sound-bar:nth-child(3n) { animation-duration: 2.1s; animation-delay: 0.5s; }
      .sound-bar:nth-child(4n) { animation-duration: 1.6s; animation-delay: 0.1s; }
      .sound-bar:nth-child(5n) { animation-duration: 1.9s; animation-delay: 0.7s; }

      @keyframes pulseBar {
        0% { transform: scaleY(0.25); opacity: 0.45; }
        50% { transform: scaleY(0.95); opacity: 0.95; }
        100% { transform: scaleY(0.35); opacity: 0.55; }
      }

      .floating-orb {
        animation: floatOrb 8s ease-in-out infinite alternate;
      }
      .floating-orb-2 {
        animation: floatOrb2 10s ease-in-out infinite alternate;
      }

      @keyframes floatOrb {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(35px, 20px) scale(1.1); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-30px, -15px) scale(1.08); }
      }

      .wave-glow {
        animation: wavePulse 4s ease-in-out infinite alternate;
      }
      @keyframes wavePulse {
        0% { opacity: 0.4; }
        100% { opacity: 0.85; }
      }

      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>
  <rect width="1198" height="358" x="1" y="1" rx="15" stroke="url(#primary-glow)" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Background Ambient Glow Orbs -->
  <circle class="floating-orb" cx="220" cy="90" r="140" fill="#7C3AED" opacity="0.18" filter="url(#glow-blur)"/>
  <circle class="floating-orb-2" cx="980" cy="120" r="160" fill="#0284C7" opacity="0.18" filter="url(#glow-blur)"/>
  <circle cx="600" cy="300" r="180" fill="#6366F1" opacity="0.12" filter="url(#glow-blur)"/>

  <!-- Subtle Ambient Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <!-- Dynamic Frequency Spectrum Visualizer (Bottom Layer, Safely Below Content) -->
  <g transform="translate(60, 335)">
    <!-- 44 Animated Audio Bars on left and right flanks -->
    <!-- Left Flank -->
    <g fill="url(#wave-grad-1)">
      <rect class="sound-bar" x="0" y="-70" width="6" height="70" rx="3"/>
      <rect class="sound-bar" x="12" y="-55" width="6" height="55" rx="3"/>
      <rect class="sound-bar" x="24" y="-85" width="6" height="85" rx="3"/>
      <rect class="sound-bar" x="36" y="-60" width="6" height="60" rx="3"/>
      <rect class="sound-bar" x="48" y="-95" width="6" height="95" rx="3"/>
      <rect class="sound-bar" x="60" y="-40" width="6" height="40" rx="3"/>
      <rect class="sound-bar" x="72" y="-75" width="6" height="75" rx="3"/>
      <rect class="sound-bar" x="84" y="-110" width="6" height="110" rx="3"/>
      <rect class="sound-bar" x="96" y="-50" width="6" height="50" rx="3"/>
      <rect class="sound-bar" x="108" y="-80" width="6" height="80" rx="3"/>
      <rect class="sound-bar" x="120" y="-100" width="6" height="100" rx="3"/>
      <rect class="sound-bar" x="132" y="-45" width="6" height="45" rx="3"/>
      <rect class="sound-bar" x="144" y="-65" width="6" height="65" rx="3"/>
      <rect class="sound-bar" x="156" y="-90" width="6" height="90" rx="3"/>
      <rect class="sound-bar" x="168" y="-35" width="6" height="35" rx="3"/>
    </g>

    <!-- Right Flank -->
    <g fill="url(#wave-grad-1)" transform="translate(890, 0)">
      <rect class="sound-bar" x="0" y="-35" width="6" height="35" rx="3"/>
      <rect class="sound-bar" x="12" y="-90" width="6" height="90" rx="3"/>
      <rect class="sound-bar" x="24" y="-65" width="6" height="65" rx="3"/>
      <rect class="sound-bar" x="36" y="-45" width="6" height="45" rx="3"/>
      <rect class="sound-bar" x="48" y="-100" width="6" height="100" rx="3"/>
      <rect class="sound-bar" x="60" y="-80" width="6" height="80" rx="3"/>
      <rect class="sound-bar" x="72" y="-50" width="6" height="50" rx="3"/>
      <rect class="sound-bar" x="84" y="-110" width="6" height="110" rx="3"/>
      <rect class="sound-bar" x="96" y="-75" width="6" height="75" rx="3"/>
      <rect class="sound-bar" x="108" y="-40" width="6" height="40" rx="3"/>
      <rect class="sound-bar" x="120" y="-95" width="6" height="95" rx="3"/>
      <rect class="sound-bar" x="132" y="-60" width="6" height="60" rx="3"/>
      <rect class="sound-bar" x="144" y="-85" width="6" height="85" rx="3"/>
      <rect class="sound-bar" x="156" y="-55" width="6" height="55" rx="3"/>
      <rect class="sound-bar" x="168" y="-70" width="6" height="70" rx="3"/>
    </g>
  </g>

  <!-- Flowing Sine Sound Wave Across Middle (Background Layer) -->
  <path class="wave-glow" d="M 0 280 C 180 230, 320 330, 500 280 C 680 230, 820 320, 1000 270 C 1100 240, 1160 260, 1200 275"
        fill="none" stroke="url(#wave-grad-2)" stroke-width="3" opacity="0.6"/>
  <path class="wave-glow" d="M 0 290 C 150 330, 350 240, 540 290 C 720 340, 900 250, 1080 300 C 1140 315, 1180 305, 1200 295"
        fill="none" stroke="url(#wave-grad-1)" stroke-width="2" opacity="0.7"/>

  <!-- ================= FOREGROUND CONTENT CONTAINER (NEVER OBSCURED) ================= -->

  <!-- Top Category Pill Badge -->
  <g transform="translate(60, 42)">
    <rect width="320" height="32" rx="16" fill="#1E293B" fill-opacity="0.8" stroke="#475569" stroke-width="1"/>
    <circle cx="16" cy="16" r="5" fill="#10B981"/>
    <text x="30" y="21" fill="#94A3B8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="600" letter-spacing="1.2">
      TOP VOICE AI &amp; SYNTHESIS ECOSYSTEM
    </text>
  </g>

  <!-- Main Title with Protective Text Shadow for Maximum Clarity -->
  <text class="title-text" x="60" y="132" font-size="46" fill="url(#text-grad)" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">
    Awesome Voice AI &amp; Synthesis
  </text>

  <!-- Highlight Gradient Subtitle -->
  <text class="title-text" x="60" y="176" font-size="22" fill="url(#highlight-grad)" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.7))">
    Text-to-Speech (TTS) • Voice Cloning • Neural Dubbing • Real-Time Speech AI
  </text>

  <!-- Descriptive Tagline -->
  <text class="subtitle-text" x="60" y="215" font-size="15" fill="#94A3B8" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.9))">
    A curated, industry-standard directory of production SaaS platforms, hyper-realistic voice models, and open-source runtimes.
  </text>

  <!-- Bottom Metric / Feature Chips (Foreground) -->
  <g transform="translate(60, 255)">
    <!-- Chip 1 -->
    <rect width="180" height="34" rx="8" fill="#0F172A" fill-opacity="0.9" stroke="#334155" stroke-width="1.2"/>
    <text x="14" y="22" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="600" fill="#E2E8F0">
      ⚡ 12+ Top SaaS APIs
    </text>

    <!-- Chip 2 -->
    <g transform="translate(192, 0)">
      <rect width="210" height="34" rx="8" fill="#0F172A" fill-opacity="0.9" stroke="#334155" stroke-width="1.2"/>
      <text x="14" y="22" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="600" fill="#E2E8F0">
        🌟 17+ Open-Source Models
      </text>
    </g>

    <!-- Chip 3 -->
    <g transform="translate(414, 0)">
      <rect width="200" height="34" rx="8" fill="#0F172A" fill-opacity="0.9" stroke="#334155" stroke-width="1.2"/>
      <text x="14" y="22" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="600" fill="#E2E8F0">
        🎙️ Local &amp; Edge Runtimes
      </text>
    </g>

    <!-- Chip 4 -->
    <g transform="translate(626, 0)">
      <rect width="180" height="34" rx="8" fill="#0F172A" fill-opacity="0.9" stroke="#334155" stroke-width="1.2"/>
      <text x="14" y="22" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="600" fill="#E2E8F0">
        📊 Real-Time Pricing
      </text>
    </g>
  </g>
</svg>
